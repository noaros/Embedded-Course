# CI for the course repository itself: every starter (and, on the solutions
# branch, every solution) must build warning-free, and the Lab 11 host tests
# must pass. Lab 11 students write their own pipeline; see
# modules/11-testing-ci/lab.
name: course-ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi python3-cryptography
      - name: Build firmware and run host tests
        run: tools/check.sh
      - name: Size report
        run: python3 tools/size_report.py --elf 'build/**/*.elf' --markdown >> "$GITHUB_STEP_SUMMARY"
